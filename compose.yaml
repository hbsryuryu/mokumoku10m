# ローカル開発用の Docker Compose 設定
# 使い方はリポジトリ直下の README.md と docs/runbooks/local-backend.md を参照。

services:
  api:
    build: ./apps/api
    # 起動のたびにマイグレーションを適用してから、API を起動する。
    # --reload でコードの変更を自動で反映する（開発用）
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # ADR-0006: 開発初期は SQLite3。DB ファイルは named volume（api-data）に置く
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.sqlite3}
      # ローカル開発環境として動かす（未指定の場合、アプリは本番扱いになる）
      APP_ENV: ${APP_ENV:-local}
      # Feature AUTH-002: 開発用ログイン。APP_ENV=local のときだけ使える（ADR-0008）
      DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-true}
    volumes:
      # コードはフォルダごとマウントして、変更をすぐ反映する
      - ./apps/api:/app
      # SQLite3 のファイルは Windows のフォルダに置かず named volume に置く（ファイルロックを安定させるため）
      - api-data:/data

  # ADR-0006: PostgreSQL に移行するときに有効にする（今は使わない）
  # db:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_DB: mokumoku
  #     POSTGRES_USER: mokumoku
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}
  #   volumes:
  #     - db-data:/var/lib/postgresql/data

volumes:
  api-data:
  # db-data:
