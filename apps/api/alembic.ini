[alembic]
script_location = alembic
# Add the current directory (apps/api) to sys.path so that "import app" works
# even when the project is not pip-installed (e.g. inside the Docker container).
prepend_sys_path = .
path_separator = os
# NOTE: keep this file ASCII-only (Windows reads it as cp932).
# The database URL is read from app.config.settings.database_url in alembic/env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
